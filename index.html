<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presentación de datos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&display=swap" rel="stylesheet">

<!-- Librerías oficiales de Microsoft -->
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/powerbi-client@2.23.1/dist/powerbi.min.js"></script>

<style>
  :root {
    --fondo: #EEF1F4;       /* escenario claro alrededor del reporte */
    --barra: #FFFFFF;       /* barra de navegación */
    --texto: #1C2830;       /* texto principal */
    --secundario: #5B6B76;  /* texto secundario */
    --linea: #D5DCE1;       /* bordes y separadores */
    --acento: #E8952A;      /* acento: segmento actual y botón principal */
    --error: #C0392B;
    --fuente: "Archivo", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--fondo); color: var(--texto); font-family: var(--fuente); }
  body { display: grid; grid-template-rows: 1fr auto; }

  /* Escenario: el reporte va sobre una "hoja" blanca con sombra para separarlo del fondo */
  #escenario { position: relative; padding: 16px 16px 12px; min-height: 0; }
  #reporte {
    width: 100%; height: 100%; border-radius: 6px; overflow: hidden;
    background: #FFFFFF; box-shadow: 0 1px 3px rgba(28, 40, 48, 0.12), 0 6px 20px rgba(28, 40, 48, 0.08);
  }
  #reporte iframe { border: 0; }

  /* Pantalla de acceso / estados */
  #estado {
    position: absolute; inset: 0; display: grid; place-content: center; gap: 20px;
    text-align: center; padding: 24px; background: var(--fondo);
  }
  #estado h1 { font-size: clamp(2rem, 5vw, 3.5rem); font-weight: 800; font-stretch: 75%; line-height: 1; letter-spacing: -0.01em; }
  #estado p { color: var(--secundario); max-width: 46ch; margin-inline: auto; line-height: 1.5; }
  #estado.error p { color: var(--error); }
  [hidden] { display: none !important; }

  /* Barra de navegación */
  #barra {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 24px; align-items: center;
    padding: 12px 16px 14px; background: var(--barra); border-top: 1px solid var(--linea);
  }
  #titulo { font-size: 1.25rem; font-weight: 700; font-stretch: 85%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #contador { color: var(--secundario); font-size: 0.875rem; font-variant-numeric: tabular-nums; margin-left: 12px; font-weight: 400; }
  #laminas { grid-column: 1 / -1; display: flex; gap: 4px; }
  #laminas button {
    flex: 1; height: 6px; border: 0; padding: 0; border-radius: 1px; cursor: pointer;
    background: #DDE3E8; transition: background 0.2s;
  }
  #laminas button:hover { background: #C3CCD3; }
  #laminas button.vista { background: #F5C98A; }
  #laminas button.actual { background: var(--acento); }
  .controles { display: flex; gap: 8px; }

  button.boton {
    font: inherit; font-weight: 600; font-size: 0.9375rem; cursor: pointer;
    color: var(--texto); background: #FFFFFF; border: 1px solid var(--linea);
    border-radius: 4px; padding: 8px 14px;
  }
  button.boton:hover { border-color: var(--secundario); }
  button.primario { background: var(--acento); color: #FFFFFF; border-color: var(--acento); }
  button.primario:hover { filter: brightness(0.95); }
  button:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
  button:disabled { opacity: 0.4; cursor: default; }

  /* Notas del presentador */
  #notas {
    position: absolute; right: 28px; bottom: 24px; width: min(380px, calc(100% - 56px));
    background: #FFFFFF; border: 1px solid var(--linea); border-left: 3px solid var(--acento); border-radius: 4px;
    padding: 14px 16px; line-height: 1.5; font-size: 0.9375rem; box-shadow: 0 8px 24px rgba(28, 40, 48, 0.15);
  }

  @media (max-width: 640px) {
    #barra { grid-template-columns: 1fr; }
    .controles { justify-content: space-between; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  /* Varios reportes apilados: solo el activo es visible */
  #reporte { position: relative; }
  .marco { position: absolute; inset: 0; visibility: hidden; }
  .marco.activo { visibility: visible; }

  /* El segmento actual se llena conforme corre el tiempo de la diapositiva */
  #laminas button.actual {
    background: linear-gradient(90deg, var(--acento) calc(var(--avance, 1) * 100%), #F5C98A 0);
  }
  #btnReproducir { min-width: 7.5rem; }
</style>
</head>
<body>

<main id="escenario">
  <div id="reporte"></div>
  <div id="estado">
    <h1 id="tituloPresentacion">Presentación de datos</h1>
    <p id="mensaje">Inicia sesión con tu cuenta de Microsoft para cargar los reportes.</p>
    <div><button class="boton primario" id="btnEntrar">Iniciar sesión</button></div>
  </div>
  <aside id="notas" hidden></aside>
</main>

<nav id="barra" aria-label="Navegación de la presentación" hidden>
  <h2 id="titulo">—<span id="contador"></span></h2>
  <div class="controles">
    <button class="boton" id="btnReproducir" aria-pressed="true">Pausar</button>
    <button class="boton" id="btnNotas" aria-pressed="false">Notas</button>
    <button class="boton" id="btnPantalla">Pantalla completa</button>
    <button class="boton" id="btnAnterior" aria-label="Diapositiva anterior">Anterior</button>
    <button class="boton primario" id="btnSiguiente" aria-label="Diapositiva siguiente">Siguiente</button>
  </div>
  <div id="laminas" role="tablist"></div>
</nav>

<script>
/* =====================================================================
   1) CONFIGURACIÓN — lo único que necesitas editar
   ===================================================================== */
const CONFIG = {
  clientId: "244983b7-dc4b-4a77-b6d6-5d0d1caae14f",   // Id. de aplicación (Entra ID)
  tenantId: "4d97989b-1a29-4b15-a65d-e1c8b49df8cf",   // Id. de directorio (Entra ID)

  // Opciones generales de la presentación
  presentacion: {
    titulo: "Presentación de datos",  // aparece en la pestaña del navegador y al iniciar
    autoplay: true,                   // true = avanza sola al abrir; false = empieza en pausa
    duracion: 30,                     // segundos por diapositiva (si la diapositiva no define otra)
    ciclo: true,                      // true = al terminar vuelve a la primera y sigue
    pausarAlInteractuar: true,        // true = si haces clic en un visual, se pausa el avance
    ajuste: "pagina",                 // "pagina" (completa), "ancho" (llena el ancho) o "real" (tamaño original)
  },

  /* Diapositivas, en el orden en que se muestran.
     Para cada una, abre la página en app.powerbi.com y copia la URL completa de la barra de direcciones.
     Opciones por diapositiva (todas opcionales excepto url):
       titulo          → texto de la barra inferior (si no lo pones, usa el nombre de la página)
       duracion        → segundos que dura esta diapositiva; 0 = no avanza sola
       notas           → notas del presentador (tecla N)
       marcador        → nombre interno de un marcador del reporte (ver consola F12)
       ajuste          → "pagina", "ancho" o "real" solo para esta diapositiva
       todasLasPaginas → true = convierte cada página visible del reporte en una diapositiva */
  diapositivas: [
    {
      url: "https://app.powerbi.com/groups/me/reports/5b49e5bf-81b8-4945-a353-abb2400bc9ad",
      todasLasPaginas: true,
      duracion: 20,
    },

    // Ejemplos (quita las // para usarlos):
    // { url: "https://app.powerbi.com/groups/me/reports/5b49e5bf-81b8-4945-a353-abb2400bc9ad/45ece729167e8167e3db",
    //   titulo: "Tendencia de reciclajes", duracion: 45, notas: "Comentar la caída de junio." },
    // { url: "https://app.powerbi.com/groups/OTRO-WORKSPACE/reports/OTRO-REPORTE/PAGINA",
    //   titulo: "Ocupación Vía Verde", ajuste: "ancho" },
    // { url: "https://app.powerbi.com/groups/me/reports/5b49e5bf-81b8-4945-a353-abb2400bc9ad",
    //   marcador: "Bookmark1a2b3c4d", titulo: "Solo máquinas de Querétaro", duracion: 15 },
  ],
};

/* =====================================================================
   Diagnóstico: cualquier error se muestra en pantalla, no en silencio
   ===================================================================== */
const AVISOS = /file-protocol|msal-no-cargo|powerbi-no-cargo|en-iframe/;
function errorEnPantalla(texto) {
  document.getElementById("estado").hidden = false;
  document.getElementById("estado").classList.add("error");
  document.getElementById("mensaje").textContent = texto;
}
window.addEventListener("error", (e) => { if (!AVISOS.test(e.message)) errorEnPantalla(`Error: ${e.message}`); });
window.addEventListener("unhandledrejection", (e) => errorEnPantalla(`Error: ${e.reason?.message || e.reason}`));

if (location.protocol === "file:") {
  errorEnPantalla("Abriste el archivo con doble clic desde tu computadora. El visor solo funciona desde su dirección de GitHub Pages.");
  throw new Error("file-protocol");
}
if (!window.msal) {
  errorEnPantalla("No se pudo cargar la librería de inicio de sesión (MSAL). Revisa tu conexión o si la red de la empresa bloquea cdn.jsdelivr.net.");
  throw new Error("msal-no-cargo");
}
if (!window.powerbi) {
  errorEnPantalla("No se pudo cargar la librería de Power BI. Revisa tu conexión o si la red de la empresa bloquea cdn.jsdelivr.net.");
  throw new Error("powerbi-no-cargo");
}
if (window.top !== window.self) {
  errorEnPantalla("El visor está abierto dentro de una vista previa (iframe) y Microsoft no permite iniciar sesión ahí. Ábrelo en una pestaña normal de Chrome o Edge.");
  const b = document.getElementById("btnEntrar");
  b.textContent = "Abrir en una pestaña nueva";
  b.hidden = false;
  b.onclick = () => window.open(location.href, "_blank");
  throw new Error("en-iframe");
}

/* =====================================================================
   2) Autenticación con Microsoft (MSAL)
   ===================================================================== */
const SCOPES = ["https://analysis.windows.net/powerbi/api/Report.Read.All"];
const msal = new window.msal.PublicClientApplication({
  auth: {
    clientId: CONFIG.clientId,
    authority: `https://login.microsoftonline.com/${CONFIG.tenantId}`,
    redirectUri: window.location.origin + window.location.pathname.replace(/index\.html$/i, ""),
  },
  cache: { cacheLocation: "sessionStorage" },
});

async function obtenerToken() {
  const cuenta = msal.getAllAccounts()[0];
  try {
    const r = await msal.acquireTokenSilent({ scopes: SCOPES, account: cuenta });
    return r.accessToken;
  } catch {
    await msal.acquireTokenRedirect({ scopes: SCOPES, account: cuenta });
  }
}

/* =====================================================================
   3) Carga de reportes (uno por cada reporte distinto en las diapositivas)
   ===================================================================== */
const $ = (id) => document.getElementById(id);
const models = window["powerbi-client"].models;
const AJUSTES = {
  pagina: models.DisplayOption.FitToPage,
  ancho:  models.DisplayOption.FitToWidth,
  real:   models.DisplayOption.ActualSize,
};
const P = Object.assign(
  { titulo: "Presentación de datos", autoplay: true, duracion: 30, ciclo: true, pausarAlInteractuar: true, ajuste: "pagina" },
  CONFIG.presentacion
);

const reportes = new Map();   // reportId → promesa del reporte cargado
const cargados = new Map();   // reportId → reporte ya cargado
let diapositivas = [], actual = 0, reproduciendo = P.autoplay, transcurrido = 0, ultimoTick = 0;
const vistas = new Set();

function parsearUrl(url) {
  if (/\/apps\//i.test(url)) {
    throw new Error(`Esta URL es de una App de Power BI y no es compatible. Abre el reporte desde su área de trabajo y copia esa URL: ${url}`);
  }
  const m = String(url).match(/groups\/([^/?#]+)\/reports\/([0-9a-f-]{36})(?:\/([^/?#]+))?/i);
  if (!m) throw new Error(`No reconozco esta URL de Power BI: ${url}`);
  return { workspace: m[1], reportId: m[2], pagina: m[3] };
}

function obtenerReporte(workspace, reportId, token) {
  if (!reportes.has(reportId)) reportes.set(reportId, crearReporte(workspace, reportId, token));
  return reportes.get(reportId);
}

async function crearReporte(workspace, reportId, token) {
  const api = workspace === "me"
    ? "https://api.powerbi.com/v1.0/myorg"
    : `https://api.powerbi.com/v1.0/myorg/groups/${workspace}`;
  const resp = await fetch(`${api}/reports/${reportId}`, { headers: { Authorization: `Bearer ${token}` } });
  if (!resp.ok) {
    throw new Error(`No se pudo abrir el reporte ${reportId} (error ${resp.status}). Revisa que la URL sea correcta y que tu cuenta tenga acceso a ese espacio de trabajo.`);
  }
  const info = await resp.json();

  const contenedor = document.createElement("div");
  contenedor.className = "marco";
  $("reporte").appendChild(contenedor);

  const ajusteInicial = AJUSTES[P.ajuste] ?? AJUSTES.pagina;
  const reporte = powerbi.embed(contenedor, {
    type: "report",
    id: reportId,
    embedUrl: info.embedUrl,
    accessToken: token,
    tokenType: models.TokenType.Aad,
    settings: {
      panes: { filters: { visible: false }, pageNavigation: { visible: false } },
      background: models.BackgroundType.Default,
      layoutType: models.LayoutType.Custom,
      customLayout: { displayOption: ajusteInicial },
    },
  });

  const entrada = { reportId, nombre: info.name, contenedor, reporte, paginas: [], ajusteActual: ajusteInicial };

  await new Promise((listo, falla) => {
    let yaCargo = false;
    reporte.on("loaded", async () => {
      yaCargo = true;
      entrada.paginas = await reporte.getPages();
      const marcadores = await reporte.bookmarksManager.getBookmarks();
      // Útil para configurar: en la consola (F12) aparecen los nombres de páginas y marcadores
      console.log(`Reporte: ${info.name}`);
      console.table(entrada.paginas.map(p => ({ pagina: p.displayName, nombreInterno: p.name })));
      if (marcadores.length) console.table(marcadores.map(m => ({ marcador: m.displayName, nombreInterno: m.name })));
      listo();
    });
    reporte.on("error", (e) => {
      console.error(`Power BI (${info.name}):`, e.detail);
      if (!yaCargo) falla(new Error(`Power BI no pudo cargar "${info.name}": ${e.detail?.message || "error desconocido"}`));
    });
  });

  if (P.pausarAlInteractuar) {
    const pausarPorClic = () => { if (reproduciendo) alternarReproduccion(false); };
    ["visualClicked", "dataSelected", "buttonClicked"].forEach(ev => reporte.on(ev, pausarPorClic));
  }

  cargados.set(reportId, entrada);
  return entrada;
}

async function armarDiapositivas(token) {
  if (!CONFIG.diapositivas?.length) throw new Error("Agrega al menos una diapositiva en CONFIG.diapositivas.");
  const urls = CONFIG.diapositivas.map(d => parsearUrl(d.url));

  // Todos los reportes se cargan en paralelo para que el cambio entre ellos sea inmediato
  const entradas = await Promise.all(urls.map(u => obtenerReporte(u.workspace, u.reportId, token)));

  const lista = [];
  CONFIG.diapositivas.forEach((d, i) => {
    const r = entradas[i];
    if (d.todasLasPaginas) {
      r.paginas.filter(p => p.visibility === 0).forEach(p =>
        lista.push({ ...d, reportId: r.reportId, pagina: p.name, titulo: p.displayName }));
      return;
    }
    const buscada = d.pagina || urls[i].pagina;
    const pag = buscada ? r.paginas.find(p => p.name === buscada || p.displayName === buscada) : null;
    if (buscada && !pag) console.warn(`No existe la página "${buscada}" en "${r.nombre}"; se mostrará la página inicial.`);
    lista.push({ ...d, reportId: r.reportId, pagina: pag?.name, titulo: d.titulo || pag?.displayName || r.nombre });
  });
  return lista;
}

/* =====================================================================
   4) Navegación, temporizador y ciclo
   ===================================================================== */
function construirLaminas() {
  $("laminas").innerHTML = "";
  diapositivas.forEach((d, i) => {
    const b = document.createElement("button");
    b.setAttribute("role", "tab");
    b.setAttribute("aria-label", `Ir a ${d.titulo}`);
    b.title = d.titulo;
    b.onclick = () => irA(i);
    $("laminas").appendChild(b);
  });
}

async function irA(i) {
  if (!diapositivas.length) return;
  const total = diapositivas.length;
  if (i >= total) {
    if (!P.ciclo) { alternarReproduccion(false); return; }
    i = 0;
  }
  if (i < 0) i = P.ciclo ? total - 1 : 0;

  actual = i;
  transcurrido = 0;
  vistas.add(i);
  const d = diapositivas[i];
  const r = cargados.get(d.reportId);

  try {
    if (d.marcador) {
      await r.reporte.bookmarksManager.apply(d.marcador);
    } else if (d.pagina) {
      const p = r.paginas.find(x => x.name === d.pagina);
      if (p) await p.setActive();
    }
    const ajuste = AJUSTES[d.ajuste || P.ajuste] ?? AJUSTES.pagina;
    if (ajuste !== r.ajusteActual) {
      await r.reporte.updateSettings({ layoutType: models.LayoutType.Custom, customLayout: { displayOption: ajuste } });
      r.ajusteActual = ajuste;
    }
  } catch (e) { console.error(e); }

  // Si mientras cargaba se cambió de diapositiva, no mostrar esta
  if (actual !== i) return;
  for (const x of cargados.values()) x.contenedor.classList.toggle("activo", x === r);
  actualizarBarra();
}

function actualizarBarra() {
  const d = diapositivas[actual];
  const total = diapositivas.length;
  $("titulo").firstChild.textContent = d.titulo;
  $("contador").textContent = `${actual + 1} de ${total}`;
  $("btnAnterior").disabled = !P.ciclo && actual === 0;
  $("btnSiguiente").disabled = !P.ciclo && actual === total - 1;
  [...$("laminas").children].forEach((b, j) => {
    b.classList.toggle("actual", j === actual);
    b.classList.toggle("vista", vistas.has(j) && j !== actual);
    b.setAttribute("aria-selected", j === actual);
    if (j !== actual) b.style.removeProperty("--avance");
  });
  $("notas").textContent = d.notas || "Esta diapositiva no tiene notas.";
  pintarAvance();
}

function duracionDe(d) {
  return (d.duracion ?? P.duracion) * 1000;
}

function pintarAvance() {
  const b = $("laminas").children[actual];
  if (!b) return;
  const dur = duracionDe(diapositivas[actual]);
  const avance = dur > 0 && reproduciendo ? Math.min(transcurrido / dur, 1) : 1;
  b.style.setProperty("--avance", avance);
}

function tick(ahora) {
  const dt = ultimoTick ? ahora - ultimoTick : 0;
  ultimoTick = ahora;
  if (reproduciendo && diapositivas.length && !document.hidden) {
    const dur = duracionDe(diapositivas[actual]);
    if (dur > 0) {
      transcurrido += dt;
      pintarAvance();
      if (transcurrido >= dur) irA(actual + 1);
    }
  }
  requestAnimationFrame(tick);
}

function alternarReproduccion(forzar) {
  reproduciendo = typeof forzar === "boolean" ? forzar : !reproduciendo;
  $("btnReproducir").textContent = reproduciendo ? "Pausar" : "Reproducir";
  $("btnReproducir").setAttribute("aria-pressed", reproduciendo);
  pintarAvance();
}

/* =====================================================================
   5) Controles
   ===================================================================== */
$("btnSiguiente").onclick = () => irA(actual + 1);
$("btnAnterior").onclick  = () => irA(actual - 1);
$("btnReproducir").onclick = () => alternarReproduccion();
$("btnNotas").onclick = () => {
  const oculto = !$("notas").hidden;
  $("notas").hidden = oculto;
  $("btnNotas").setAttribute("aria-pressed", !oculto);
};
$("btnPantalla").onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen();
};
$("btnEntrar").onclick = async () => {
  $("mensaje").textContent = "Redirigiendo al inicio de sesión de Microsoft…";
  try {
    await msal.loginRedirect({ scopes: SCOPES });
  } catch (e) {
    errorEnPantalla(`No se pudo iniciar sesión: ${e.errorCode || ""} ${e.message}`);
  }
};

// Teclado (funciona cuando el foco está fuera del reporte)
document.addEventListener("keydown", (e) => {
  if (e.target.closest?.("button") && (e.key === " " || e.key === "Enter")) return;
  if (e.key === "ArrowRight" || e.key === "PageDown") irA(actual + 1);
  if (e.key === "ArrowLeft"  || e.key === "PageUp")   irA(actual - 1);
  if (e.key === " ") { e.preventDefault(); alternarReproduccion(); }
  if (e.key.toLowerCase() === "n") $("btnNotas").click();
  if (e.key.toLowerCase() === "f") $("btnPantalla").click();
});

/* =====================================================================
   6) Arranque
   ===================================================================== */
function mostrarEstado(texto) {
  $("estado").hidden = false;
  $("estado").classList.remove("error");
  $("mensaje").textContent = texto;
  $("btnEntrar").hidden = msal.getAllAccounts().length > 0;
}

async function iniciarPresentacion() {
  mostrarEstado("Cargando los reportes…");
  const token = await obtenerToken();
  if (!token) return;

  diapositivas = await armarDiapositivas(token);
  if (!diapositivas.length) throw new Error("Las diapositivas configuradas no tienen páginas visibles.");

  construirLaminas();
  alternarReproduccion(P.autoplay);
  $("estado").hidden = true;
  $("barra").hidden = false;
  await irA(0);
  requestAnimationFrame(tick);

  // El token dura ~1 hora; se renueva cada 50 minutos en todos los reportes
  setInterval(async () => {
    const nuevo = await obtenerToken();
    if (nuevo) for (const r of cargados.values()) r.reporte.setAccessToken(nuevo);
  }, 50 * 60 * 1000);
}

(async () => {
  document.title = P.titulo;
  $("tituloPresentacion").textContent = P.titulo;
  try {
    const r = await msal.handleRedirectPromise();
    if (r?.account) msal.setActiveAccount(r.account);
    if (msal.getAllAccounts().length) await iniciarPresentacion();
    else mostrarEstado("Inicia sesión con tu cuenta de Microsoft para cargar los reportes.");
  } catch (e) {
    errorEnPantalla(e.message);
  }
})();
</script>
</body>
</html>
